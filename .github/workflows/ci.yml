name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sanity-check:
    name: Environment Sanity Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run sanity checks
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./sanity-check.sh
        continue-on-error: true

  python-checks:
    name: Python Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv sync

      - name: Format check (black)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run black --check src/ tests/

      - name: Import sorting check (isort)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run isort --check src/ tests/

      - name: Lint (pylint - errors only)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run pylint src/ --errors-only --disable=import-error
        continue-on-error: true

      - name: Type check typed green zone (mypy)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run mypy

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv sync

      - name: Run tests
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          uv run pytest tests/ --cov=src --cov-report=xml --cov-report=term

  package-smoke:
    name: Package Install Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel
        run: uv build --wheel

      - name: Dry-run install wheel from clean venv
        run: |
          uv venv --python 3.11 .package-smoke
          uv pip install --python .package-smoke/bin/python --dry-run dist/*.whl

  web-ui-checks:
    name: Web UI Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  host-image-checks:
    name: host-image Worker Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-image
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: host-image/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --run

      - name: Audit
        run: npm audit --audit-level=moderate
