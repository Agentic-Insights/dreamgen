name: Cloudflare Deploy

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-gallery/**"
      - "host-image/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:
    inputs:
      deploy_gallery:
        description: "Deploy dreamgen-gallery Pages"
        required: true
        type: boolean
        default: true
      deploy_host:
        description: "Deploy host-image Worker"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gallery:
    name: Deploy gallery Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.deploy_gallery == true
    defaults:
      run:
        working-directory: cloudflare-gallery
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Cloudflare Pages
        run: npx wrangler@4 pages deploy public --project-name dreamgen-gallery --branch main

  deploy-host:
    name: Deploy host-image Worker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_host == true
    defaults:
      run:
        working-directory: host-image
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        run: npx wrangler@4 deploy
