name: Semantic Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "graphify-out/**"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    environment:
      name: pypi
      url: https://pypi.org/project/dreamgen/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Run Python Semantic Release using the repo's pyproject configuration
          uv run python -m semantic_release version

      - name: Publish to PyPI
        if: success()
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Check if dist directory exists (created by semantic-release)
          if [ -d "dist" ]; then
            echo "Publishing to PyPI..."
            uv publish --token $PYPI_TOKEN
          else
            echo "No dist directory found, skipping PyPI publish"
          fi
